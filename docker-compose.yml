version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      # Pass the API key from host environment or .env file
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      # Persist conversations on host
      - ./data/conversations:/app/data/conversations
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
